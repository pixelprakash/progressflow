# Local dev services for ProgressFlow.
#   docker compose -f infra/docker-compose.yml up -d
#
# Postgres  -> localhost:5432  (source of truth)
# MinIO     -> localhost:9000  (S3-compatible; stands in for Firebase Storage)
# MinIO UI  -> localhost:9001  (progressflow / progressflow)

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: progressflow
      POSTGRES_PASSWORD: progressflow
      POSTGRES_DB: progressflow
    ports:
      - '5432:5432'
    volumes:
      - pf_pg:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U progressflow']
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: progressflow
      MINIO_ROOT_PASSWORD: progressflow
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - pf_minio:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 5s
      retries: 10

  # Creates the media bucket on first run, then exits.
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 progressflow progressflow &&
      mc mb --ignore-existing local/progressflow-media &&
      mc anonymous set none local/progressflow-media &&
      echo 'bucket ready'
      "

volumes:
  pf_pg:
  pf_minio:
